name: Automated Macro Calendar Sync

on:
  push:
    branches:
      - main
  schedule:
    # Runs automatically every 4 hours to catch live updates when metrics drop
    - cron: '0 */4 * * *' 
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fetch Live Keyless Data (Forex Factory)
        run: |
          python3 - <<EOF
          import urllib.request
          import json
          import csv

          # The institutional standard free public feed (No API Key needed)
          url = "https://nfs.faireconomy.media/ff_calendar_thisweek.json"
          
          # Use a standard browser header to connect cleanly
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          
          try:
              response = urllib.request.urlopen(req)
              events = json.loads(response.read().decode())
              
              headers = ["Indicator", "Impact", "Previous", "Forecast", "Actual", "Correlation"]
              csv_rows = []
              
              for item in events:
                  # We only care about United States Dollar (USD) metrics
                  if item.get('country') != 'USD':
                      continue
                      
                  title = item.get('title', '')
                  impact = item.get('impact', '').capitalize()
                  
                  # Keep the dashboard clean by only tracking High and Medium impact events
                  if impact not in ["High", "Medium"]:
                      continue
                      
                  actual = item.get('actual', '') or ""
                  forecast = item.get('forecast', '') or ""
                  previous = item.get('previous', '') or ""
                  
                  # Check for inverse metrics automatically (e.g., Jobless Claims)
                  correlation = "Inverse" if ("unemployment" in title.lower() or "claims" in title.lower()) else "Normal"
                  
                  csv_rows.append([title, impact, previous, forecast, actual, correlation])
                  
              with open('data.csv', 'w', newline='', encoding='utf-8') as f:
                  writer = csv.writer(f)
                  writer.writerow(headers)
                  writer.writerows(csv_rows)
                  
              print(f"Success! Downloaded {len(csv_rows)} live metrics without any API keys.")
              
          except Exception as e:
              print(f"Data sync failed: {e}")
              exit(1)
          EOF

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated Live Data Sync (Keyless) [skip ci]"
          file_pattern: 'data.csv'
