name: Automated Macro Calendar Sync

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 8 * * *' # Runs automatically every day at 8 AM UTC
  workflow_dispatch: # Allows you to manually click "Run workflow" anytime

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Request Dependencies
        run: pip install requests

      - name: Fetch Live Economic Calendar Data
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }} # Injects your hidden key securely
        run: |
          python3 - <<EOF
          import os
          import csv
          import requests
          from datetime import datetime, timedelta

          api_key = os.environ.get('FMP_API_KEY')
          if not api_key:
              print("Error: FMP_API_KEY secret is missing!")
              exit(1)

          # Calculate a 14-day tracking window (from 7 days ago to 7 days ahead)
          today = datetime.now()
          start_date = (today - timedelta(days=7)).strftime('%Y-%m-%d')
          end_date = (today + timedelta(days=7)).strftime('%Y-%m-%d')

          url = f"https://financialmodelingprep.com/api/v3/economic_calendar?from={start_date}&to={end_date}&apikey={api_key}"
          
          try:
              response = requests.get(url)
              events = response.json()
              
              if not isinstance(events, list):
                  print("Failed to pull standard array structure from endpoint.")
                  exit(1)

              headers = ["Indicator", "Impact", "Previous", "Forecast", "Actual", "Correlation"]
              csv_rows = []

              for item in events:
                  # Filter strictly for United States macroeconomic indicators
                  if item.get('country') != 'US':
                      continue

                  event_name = item.get('event', '')
                  
                  # Keep only the high-impact core market movers matching your JS keywords
                  keywords = ['CPI', 'PCE', 'GDP', 'Payrolls', 'Unemployment', 'PMI', 'Retail', 'Claims', 'FOMC', 'Funds Rate']
                  if not any(kw in event_name for kw in keywords):
                      continue

                  # Clean and format Impact labels
                  raw_impact = str(item.get('impact', '')).upper()
                  ui_impact = "Low"
                  if "HIGH" in raw_impact or "3" in raw_impact: ui_impact = "High"
                  elif "MEDIUM" in raw_impact or "MODERATE" in raw_impact or "2" in raw_impact: ui_impact = "Medium"

                  # Extract data parameters safely
                  actual = item.get('actual')
                  forecast = item.get('consensus') # Consensus acts as the macro forecast target
                  previous = item.get('previous')

                  # Standardize string representations for your JS float parsing loops
                  act_str = str(actual) if actual is not None else ""
                  for_str = str(forecast) if forecast is not None else ""
                  prev_str = str(previous) if previous is not None else ""

                  # Determine economic correlation rules dynamically
                  name_lower = event_name.lower()
                  correlation = "Inverse" if ("unemployment" in name_lower or "claims" in name_lower) else "Normal"

                  csv_rows.append([event_name, ui_impact, prev_str, for_str, act_str, correlation])

              # Save the authentic live macro metrics straight into your dashboard file
              with open('data.csv', 'w', newline='', encoding='utf-8') as file:
                  writer = csv.writer(file)
                  writer.writerow(headers)
                  writer.writerows(csv_rows)

              print(f"Successfully sync'd {len(csv_rows)} authentic live macro metrics into data.csv")

          except Exception as e:
              print(f"Operational breakdown: {e}")
              exit(1)
          EOF

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated Live Data Sync [skip ci]"
          file_pattern: 'data.csv'
