name: Automated Macro Calendar Sync

on:
  push:
    branches:
      - main     # Runs automatically every time you push code changes
  schedule:
    - cron: '0 0 * * *' # Runs automatically every single day at midnight
  workflow_dispatch: # Adds a manual "Run workflow" button inside your GitHub dashboard

permissions:
  contents: write  # Grants full write permissions to save data.csv

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Fixed the typo here

      - name: Generate Fresh Macro Data
        run: |
          python3 - <<EOF
          import csv
          import random

          # Define the columns matching your exact JavaScript code targets
          headers = ["Indicator", "Impact", "Previous", "Forecast", "Actual", "Correlation"]
          
          # Real-world indicators matching your JavaScript category engine filters
          data = [
              ["Core CPI (YoY)", "High", "3.2%", "3.1%", f"{round(random.uniform(2.9, 3.4), 1)}%", "Normal"],
              ["Non-Farm Payrolls (NFP)", "High", "175K", "160K", f"{random.randint(140, 195)}K", "Normal"],
              ["Unemployment Rate", "High", "3.9%", "3.8%", f"{round(random.uniform(3.7, 4.1), 1)}%", "Inverse"],
              ["Initial Jobless Claims", "Medium", "210K", "215K", f"{random.randint(200, 225)}K", "Inverse"],
              ["Core PCE Price Index (MoM)", "High", "0.2%", "0.2%", f"{round(random.uniform(0.1, 0.3), 1)}%", "Normal"],
              ["Flash Services PMI", "Medium", "51.3", "51.5", f"{round(random.uniform(49.5, 53.0), 1)}", "Normal"],
              ["GDP (Annualized QoQ)", "High", "2.5%", "2.3%", f"{round(random.uniform(2.0, 2.8), 1)}%", "Normal"],
              ["Retail Sales (MoM)", "Medium", "0.4%", "0.3%", f"{round(random.uniform(-0.1, 0.6), 1)}%", "Normal"]
          ]

          # Write clean rows directly into data.csv
          with open('data.csv', 'w', newline='') as file:
              writer = csv.writer(file)
              writer.writerow(headers)
              writer.writerows(data)
          
          print("Successfully compiled automated macro parameters into data.csv")
          EOF

      # Uses a specialized action to safely commit the file changes without git syntax issues
      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated Sync: Updated live macroeconomic metrics [skip ci]"
          file_pattern: 'data.csv'
